name: encoding-check

# 编码守卫：任何被跟踪的文本文件若带 UTF-8 BOM 或非 UTF-8，则流水线失败。
# 这是与本地 .githooks/pre-commit 对应的服务端兜底，保证无论在什么环境提交，仓库里都是 UTF-8 无 BOM。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  encoding-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify UTF-8 without BOM
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          patterns = [
              "*.cs", "*.csx", "*.vb", "*.resx", "*.csproj", "*.vbproj", "*.fsproj",
              "*.sln", "*.slnx", "*.slnf", "*.props", "*.targets",
              "*.ts", "*.tsx", "*.js", "*.jsx", "*.mjs", "*.cjs",
              "*.css", "*.scss", "*.sass", "*.less",
              "*.json", "*.xml", "*.config", "*.yml", "*.yaml", "*.md", "*.txt", "*.sql",
              "*.sh", "*.ps1", "*.psm1", "*.psd1",
              ".editorconfig", ".gitattributes", ".gitignore",
          ]
          output = subprocess.run(
              ["git", "ls-files", "-z", "--", *patterns],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          failed = False

          for raw_path in output.rstrip(b"\0").split(b"\0"):
              if not raw_path:
                  continue
              path = Path(raw_path.decode(sys.getfilesystemencoding(), errors="surrogateescape"))
              if not path.is_file():
                  continue
              content = path.read_bytes()
              if content.startswith(b"\xef\xbb\xbf"):
                  print(f"::error file={path}::文件带有 UTF-8 BOM，请保存为 UTF-8 无 BOM。")
                  failed = True
                  continue
              try:
                  content.decode("utf-8", errors="strict")
              except UnicodeDecodeError:
                  print(f"::error file={path}::文件不是合法的 UTF-8 编码。")
                  failed = True

          if failed:
              print("编码校验失败：存在带 BOM 或非 UTF-8 的文件。")
              raise SystemExit(1)
          print("编码校验通过：所有文本文件均为 UTF-8 无 BOM。")
