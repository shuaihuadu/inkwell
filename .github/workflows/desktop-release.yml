name: desktop-release

on:
  push:
    branches: [main]
    paths:
      - "src/app/desktop/**"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/app/desktop/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare-release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate release version
        id: version
        shell: bash
        working-directory: src/app/desktop
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./package.json').version")"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+$ ]]; then
            echo "Desktop version '$base_version' must include a prerelease stage, for example '0.0.1-alpha'." >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          release_version="${base_version}.${short_sha}"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$release_version" >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            script: dist:win
            artifacts: |
              src/app/desktop/release/*.exe
              src/app/desktop/release/*.msi
          - platform: macos
            os: macos-latest
            script: dist:mac
            artifacts: |
              src/app/desktop/release/*.dmg
              src/app/desktop/release/*.zip
          - platform: linux
            os: ubuntu-latest
            script: dist:linux
            artifacts: |
              src/app/desktop/release/*.AppImage
              src/app/desktop/release/*.deb
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      INKWELL_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      INKWELL_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/desktop/package-lock.json

      - name: Install dependencies
        working-directory: src/app/desktop
        run: npm ci

      - name: Set packaged application version
        working-directory: src/app/desktop
        run: npm version "${{ needs.prepare.outputs.release_version }}" --no-git-tag-version --allow-same-version

      - name: Build installers
        working-directory: src/app/desktop
        run: npm run ${{ matrix.script }} -- --config.buildVersion=0.0.${{ github.run_number }}.${{ github.run_attempt }}

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: inkwell-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: publish-github-release
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
